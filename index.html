<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>Earnify Rewards</title>

<style>
body {
  margin: 0;
  font-family: system-ui, Arial;
  background: #0b1020;
  color: #fff;
}

.app {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: rgba(255,255,255,0.08);
  padding: 20px;
  border-radius: 20px;
}

h1 {
  margin-bottom: 10px;
}

.actions {
  display: grid;
  gap: 10px;
}

.btn {
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #7c3aed, #22d3ee);
  color: white;
  font-size: 16px;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="app">

  <div class="card">
    <h1>Earnify Rewards</h1>

    <div class="actions">

      <button class="btn">🎬 Rewarded Interstitial</button>

      <button class="btn">🎁 Rewarded Popup</button>

      <button class="btn">📺 In-App Interstitial</button>

    </div>

    <div style="margin-top:15px;">
      <button class="btn">📊 My Stats</button>
      <button class="btn">⚙️ Check SDK</button>
      <button class="btn">🧹 Reset Stats</button>
    </div>

  </div>

</div>

</body>
</html>
