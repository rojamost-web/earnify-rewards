<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Ad App</title>

  <!-- Monetag SDK -->
  <script src='//libtl.com/sdk.js' data-zone='10947945' data-sdk='show_10947945'></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: white;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
    }

    .btn {
      display: block;
      width: 80%;
      margin: 15px auto;
      padding: 15px;
      border-radius: 12px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: linear-gradient(45deg, #06b6d4, #8b5cf6);
    }

    .card {
      margin: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #020617;
      border: 1px solid #1e293b;
    }

    .status {
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>🚀 Mini Ad Dashboard</h1>

  <p>SDK Status: <span id="sdk" class="status">Checking...</span></p>

  <!-- Buttons -->
  <button class="btn" onclick="showInterstitial()">🎁 Rewarded Interstitial</button>
  <button class="btn" onclick="showPopup()">📢 Rewarded Popup</button>
  <button class="btn" onclick="showInApp()">⚡ In-App Ads</button>

  <!-- Stats -->
  <div class="card">
    <h2>📊 Stats</h2>
    <p>Shown: <span id="shown">0</span></p>
    <p>Failed: <span id="failed">0</span></p>
  </div>

  <script>
    let shown = 0;
    let failed = 0;

    function updateUI() {
      document.getElementById("shown").innerText = shown;
      document.getElementById("failed").innerText = failed;
    }

    // SDK check
    window.onload = () => {
      setTimeout(() => {
        if (window.show_10947945) {
          document.getElementById("sdk").innerText = "Loaded ✅";
          document.getElementById("sdk").style.color = "lightgreen";
        } else {
          document.getElementById("sdk").innerText = "Not Loaded ❌";
          document.getElementById("sdk").style.color = "red";
        }
      }, 1000);
    };

    // 1. Interstitial
    function showInterstitial() {
      if (!window.show_10947945) {
        failed++;
        return updateUI();
      }

      show_10947945().then(() => {
        alert("Ad watched!");
        shown++;
        updateUI();
      }).catch(() => {
        failed++;
        updateUI();
      });
    }

    // 2. Popup
    function showPopup() {
      if (!window.show_10947945) {
        failed++;
        return updateUI();
      }

      show_10947945('pop').then(() => {
        shown++;
        updateUI();
      }).catch(() => {
        failed++;
        updateUI();
      });
    }

    // 3. In-App
    function showInApp() {
      if (!window.show_10947945) {
        failed++;
        return updateUI();
      }

      try {
        show_10947945({
          type: 'inApp',
          inAppSettings: {
            frequency: 2,
            capping: 0.1,
            interval: 30,
            timeout: 5,
            everyPage: false
          }
        });

        shown++;
        updateUI();
      } catch {
        failed++;
        updateUI();
      }
    }
  </script>

</body>
</html>
